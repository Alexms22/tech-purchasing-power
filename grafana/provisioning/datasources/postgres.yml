# =====================================================================
# Fonte de dados PostgreSQL - criada automaticamente no arranque
# =====================================================================
# As credenciais vêm das variáveis de ambiente passadas ao contentor do
# Grafana pelo docker-compose.yml (que por sua vez as lê do .env).
# =====================================================================
apiVersion: 1

datasources:
  - name: grafana-postgresql-datasource-1
    uid: cg1puqxn0v6rke
    type: postgres
    access: proxy
    url: tech_power_db:5432
    database: ${DB_NAME}
    user: ${DB_USER}
    secureJsonData:
      password: ${DB_PASSWORD}
    jsonData:
      sslmode: disable
      postgresVersion: 1600
      timescaledb: false
    isDefault: true
    editable: true
