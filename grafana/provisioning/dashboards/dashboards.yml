# =====================================================================
# Carregamento automático dos dashboards versionados no Git
# =====================================================================
# Qualquer ficheiro .json colocado em grafana/dashboards/ é importado no
# arranque do contentor.
# =====================================================================
apiVersion: 1

providers:
  - name: 'Tech Purchasing Power'
    orgId: 1
    folder: 'Tech Purchasing Power'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
